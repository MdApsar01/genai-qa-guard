name: GenAI QA Guard - Evaluation & Regression Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ai-qa-pipeline:
    runs-on: ubuntu-latest

    steps:
    # 1. Clone the repository code onto the GitHub runner
    - name: Check out repository
      uses: actions/checkout@v4

    # 2. Set up Python environment
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    # 3. Install all project & testing dependencies
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install chromium --with-deps

    # 4. Layer 1: API Contract & Latency SLA Tests
    - name: Run API Contract & Performance Tests
      run: pytest tests/api/ -v

    # 5. Layer 2: Playwright UI Automation Tests
    - name: Run Playwright E2E UI Tests
      run: pytest tests/e2e/ -v

    # 6. Layer 3: AI & RAG Evaluation (The RAG Triad Benchmark)
    - name: Run AI Evaluation & Faithfulness Benchmark
      run: pytest tests/evals/test_faithfulness.py -v -s

    # 7. Layer 4: AI Security & Red-Teaming Tests
    - name: Run Security & Prompt Injection Tests
      run: pytest tests/security/test_prompt_injection.py -v -s